name: Project quality checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q apps/api
      - name: Smoke test API router imports and isolated database initialization
        working-directory: apps/api
        run: |
          python -c "import os, tempfile; os.environ['APP_DATA_DIR'] = tempfile.mkdtemp(prefix='comic-ci-'); from app.main import app, _loaded_routers, _router_errors; from app.database import init_database; assert not _router_errors, _router_errors; assert len(_loaded_routers) == 14, _loaded_routers; init_database(); print('API routers and isolated database initialization passed:', len(_loaded_routers))"
      - name: Run backend regression tests
        working-directory: apps/api
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/web
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Electron main and preload syntax
        run: |
          node --check apps/desktop/main.cjs
          node --check apps/desktop/preload.cjs
