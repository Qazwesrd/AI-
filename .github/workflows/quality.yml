name: Project quality checks

on:
  push:
    branches: [master, feat/product-completion-foundation]
  # Run quality checks for stacked feature PRs as well as PRs targeting master.
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ComfyUI third-party audit gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/compliance/comfyui-portable-dependency-audit.json")
          audit = json.loads(path.read_text(encoding="utf-8"))
          assert audit["schema_version"] == 1
          assert audit["audit_status"] == "pending"
          assert audit["distribution_approved"] is False
          variants = audit["portable_variants"]
          expected = {
              "ComfyUI_windows_portable_nvidia.7z",
              "ComfyUI_windows_portable_nvidia_cu126.7z",
              "ComfyUI_windows_portable_amd.7z",
              "ComfyUI_windows_portable_intel.7z",
          }
          assert {item["asset"] for item in variants} == expected
          assert all(item["inventory_status"] != "approved" for item in variants)
          assert audit["local_ai_payload"]["runtime_audit_status"] == "not_started"
          assert audit["local_ai_payload"]["model_license_review_status"] == "upstream_license_confirmed_exact_payload_digest_and_dependency_audit_pending"
          assert audit["policy"]["approved_local_text_model_bundle"] == "qwen3:4b"
          assert audit["policy"]["local_ai_payload_included_in_full_offline_installer"] is True
          assert audit["policy"]["public_distribution_blocked_until_approved"] is True
          print("ComfyUI, Ollama, and Qwen3 third-party dependency audits are correctly blocked pending review.")
          PY
      - name: Test ComfyUI portable dependency audit utility safety guards
        run: python -m unittest apps/api/tests/test_comfyui_portable_audit_script.py -v
      - name: Validate ComfyUI dependency inventory tool safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/audit-comfyui-portable-dependencies.ps1").read_text(encoding="utf-8")
          required = [
              "7zr.exe",
              "l -slt",
              "METADATA",
              "PKG-INFO",
              'license_review_status = "pending"',
              'inventory_status = "inventory_generated_review_pending"',
              "distribution_approved = $false",
              "MaximumEvidenceFiles",
              "MaximumMetadataBytes",
              "MaximumLicenseBytes",
              "MaximumTotalEvidenceBytes",
              "finally {",
              "Remove-Item -LiteralPath $temporaryRoot",
          ]
          missing = [item for item in required if item not in script]
          assert not missing, f"Dependency inventory safety checks missing: {missing}"
          packer = Path("scripts/prepare-comfyui-offline-bundle.ps1").read_text(encoding="utf-8")
          assert "ComfyUI-Payload/audit-comfyui-portable-dependencies.ps1" in packer
          assert "dependency_inventory_tool" in packer
          frontend_audit = Path("scripts/audit-comfyui-frontend-npm-licenses.ps1").read_text(encoding="utf-8")
          frontend_required = [
              'version -cne "1.59.6"',
              'packageManager -cne "pnpm@11.13.1"',
              '26.8.2',
              '--prod --frozen-lockfile --ignore-scripts',
              'node_modules/.pnpm',
              'license_expression_missing_manual_review_required',
              'inventory_generated_manual_license_review_pending',
              'distribution_approved = $false',
              'Get-FileHash',
          ]
          frontend_missing = [item for item in frontend_required if item not in frontend_audit]
          assert not frontend_missing, f"Frontend npm license inventory safeguards missing: {frontend_missing}"
          assert "audit-comfyui-frontend-npm-licenses.ps1" in packer
          assert "npm_dependency_audit" in packer
          print("Pinned ComfyUI Frontend production npm dependency license inventory is included and remains unapproved pending review.")
          print("ComfyUI dependency inventory tool safeguards and offline-bundle inclusion are present.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q apps/api
      - name: Smoke test API router imports and isolated database initialization
        working-directory: apps/api
        run: |
          python -c "import os, tempfile; os.environ['APP_DATA_DIR'] = tempfile.mkdtemp(prefix='comic-ci-'); from app.main import app, ROUTER_MODULES, _loaded_routers, _router_errors; from app.database import init_database; assert not _router_errors, _router_errors; assert len(_loaded_routers) == len(ROUTER_MODULES), _loaded_routers; init_database(); print('API routers and isolated database initialization passed:', len(_loaded_routers))"
      - name: Run backend regression tests
        working-directory: apps/api
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/web
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Electron main, preload and manual capture syntax
        run: |
          node --check apps/desktop/main.cjs
          node --check apps/desktop/preload.cjs
          node --check apps/desktop/capture-manual-screenshots.cjs
          node --test apps/desktop/ollama-runtime-installer.test.cjs
