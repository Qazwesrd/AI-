name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches: [master, offline-ai-engine-integration]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build-windows.ps1"
      - "scripts/update-desktop-only.ps1"
      - "scripts/test-desktop-only-update.ps1"
      - "docs/manual/**"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/build-full-offline-installer.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build-windows.ps1"
      - "scripts/update-desktop-only.ps1"
      - "scripts/test-desktop-only-update.ps1"
      - "docs/manual/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

# Serialize master release builds so two commits cannot upload the same
# versioned assets to one GitHub Release at the same time. PR validation
# builds remain independent per pull request and never publish releases.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('windows-installer-pr-{0}', github.event.pull_request.number) || 'windows-installer-master-release' }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Python environment
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/api/.venv/Scripts/python.exe -m pip install -r apps/api/requirements.txt pyinstaller

      - name: Install frontend and desktop dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/web --include=dev
          npm ci --prefix apps/desktop --include=dev

      - name: Test local Ollama runtime detection
        shell: pwsh
        run: |
          node --check apps/desktop/main.cjs
          node --check apps/desktop/ollama-runtime-installer.cjs
          node --test apps/desktop/ollama-runtime-installer.test.cjs


      - name: Download FFmpeg runtime for offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $PWD "apps/desktop/build-resources/ffmpeg"
          $temp = Join-Path $env:RUNNER_TEMP "ffmpeg-runtime"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "AI-Comic-Studio-CI" } -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match "win64-gpl.*\.zip$" -and $_.name -notmatch "shared" } |
            Select-Object -First 1
          if (!$asset) { throw "No static Windows FFmpeg GPL build found in the latest release." }
          $archive = Join-Path $temp "ffmpeg.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -TimeoutSec 240
          if ((Get-Item $archive).Length -lt 10MB) { throw "FFmpeg archive download is incomplete." }
          $extract = Join-Path $temp "extract"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw "Downloaded FFmpeg archive lacks ffmpeg.exe or ffprobe.exe." }
          Copy-Item $ffmpeg.FullName (Join-Path $target "ffmpeg.exe") -Force
          Copy-Item $ffprobe.FullName (Join-Path $target "ffprobe.exe") -Force
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $file = Get-Item (Join-Path $target $name)
            if ($file.Length -lt 1MB) { throw "$name is unexpectedly small." }
            Write-Host "$name : $($file.Length) bytes"
          }

      - name: Verify desktop-only update safety
        shell: pwsh
        run: |
          ./scripts/test-desktop-only-update.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      - name: Verify installer and write SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "apps/desktop/release"
          $installers = @(Get-ChildItem $release -File -Filter "*Setup*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one fresh Windows installer; found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -LiteralPath (Join-Path $release "$($installer.Name).sha256") -Encoding ascii
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Read desktop version
        id: desktop-version
        shell: pwsh
        run: |
          $package = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
          if (!$package.version -or $package.version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid desktop version in package.json." }
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $($package.version)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Comic-Studio-Windows-Setup
          path: |
            apps/desktop/release/*Setup*.exe
            apps/desktop/release/*Setup*.exe.sha256
            scripts/update-desktop-only.ps1
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows installer to GitHub Releases
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.desktop-version.outputs.version }}"
          $tag = "desktop-v$version"
          $title = "AI漫剧制作大师 Windows $version"
          $notes = @'
          Windows 桌面安装包。

          - 包含桌面启动器、本地 API 和 Web 前端。
          - 安装器内置 FFmpeg / FFprobe，开箱即可使用。
          - 提供桌面专用升级脚本；升级只更新程序，不部署或覆盖本地 AI 引擎和模型。
          - 本地模型与本地图片引擎按已安装资源运行；任何外部 AI 服务均需用户主动配置和确认。
          '@

          # Ensure the git tag exists before creating or resolving the Release.
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0 -or !$tagRef) {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "创建版本 Git 标签失败：$tag" }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "推送版本 Git 标签失败：$tag" }
          }

          # Resolve by listing releases instead of the tag lookup endpoint.
          # GitHub can briefly return 404 for releases created in the same job.
          $releaseList = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0 -or !$releaseList) { throw "无法读取 GitHub Releases 列表。" }
          $release = @($releaseList | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1)[0]
          if (!$release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = $title
              body = $notes
              draft = $true
              prerelease = $false
            } | ConvertTo-Json -Depth 5
            $release = $payload | gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" --input - | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !$release.id) { throw "创建 GitHub Release 失败。" }
          }
          if (!$release.id) { throw "Release 信息缺少 ID，无法安全上传资产。" }

          $releaseDir = Join-Path $PWD "apps/desktop/release"
          Copy-Item "scripts/update-desktop-only.ps1" (Join-Path $releaseDir "update-desktop-only.ps1") -Force
          $files = @(Get-ChildItem $releaseDir -File | Where-Object {
            $_.Name -like "*Setup*.exe" -or
            $_.Name -like "*Setup*.exe.sha256" -or
            $_.Name -eq "update-desktop-only.ps1"
          } | Sort-Object Name)
          if ($files.Count -ne 3) { throw "预期上传 3 个正式交付文件（安装器、SHA-256、桌面专用升级脚本），实际找到 $($files.Count) 个。" }

          $assetResponse = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets"
          if ($LASTEXITCODE -ne 0 -or !$assetResponse) { throw "无法读取 Release 资产。" }
          $assets = @($assetResponse | ConvertFrom-Json)
          $expectedAssetNames = @($files | ForEach-Object { $_.Name -replace '[^\x00-\x7F]+', '.' })
          foreach ($asset in $assets) {
            if ($expectedAssetNames -notcontains $asset.name) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
              if ($LASTEXITCODE -ne 0) { throw "无法清理非正式交付资产：$($asset.name)" }
            }
          }
          foreach ($file in $files) {
            # GitHub normalizes non-ASCII release asset names to a dot in the API response.
            # Compare the normalized name so retries replace the correct existing asset.
            $expectedAssetName = $file.Name -replace '[^\x00-\x7F]+', '.'
            $existingAsset = $assets | Where-Object { $_.name -eq $expectedAssetName } | Select-Object -First 1
            if ($existingAsset) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($existingAsset.id)"
              if ($LASTEXITCODE -ne 0) { throw "无法替换旧发布资产：$($file.Name)" }
            }
            Write-Host "Uploading $($file.Name)"
            $encodedName = [uri]::EscapeDataString($file.Name)
            Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$encodedName" -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } -ContentType "application/octet-stream" -InFile $file.FullName | Out-Null
          }

          $assetResponse = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets"
          if ($LASTEXITCODE -ne 0 -or !$assetResponse) { throw "无法核对 Release 资产。" }
          $assets = @($assetResponse | ConvertFrom-Json)
          if ($assets.Count -ne 3) { throw "正式 Release 应只包含 3 个交付资产，实际为 $($assets.Count) 个。" }
          foreach ($file in $files) {
            $expectedAssetName = $file.Name -replace '[^\x00-\x7F]+', '.'
            $verifiedAsset = $assets | Where-Object { $_.name -eq $expectedAssetName } | Select-Object -First 1
            if (!$verifiedAsset -or $verifiedAsset.state -ne "uploaded" -or $verifiedAsset.size -ne $file.Length) {
              throw "Release 资产校验失败：$($file.Name)；API 名称：$expectedAssetName"
            }
          }

          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw "Release 资产核对通过，但发布草稿失败。" }
          Write-Host "Release $tag published with $($files.Count) verified assets."
