name: Windows desktop installer

on:
  workflow_dispatch:
    inputs:
      build_offline_bundle:
        description: "仅在需要内部验证完整离线套件时启用（预计约 13 GiB）"
        required: false
        type: boolean
        default: true
  push:
    branches: [master, feat/product-completion-foundation]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/manual/**"
      - ".github/workflows/windows-release.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/manual/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

# Serialize master release builds so two commits cannot upload the same
# versioned assets to one GitHub Release at the same time. PR validation
# builds remain independent per pull request and never publish releases.
concurrency:
  # Keep pull requests, push validation and manual offline-bundle builds
  # independent; never cancel a long-running offline bundle build.
  group: ${{ github.event_name == 'pull_request' && format('windows-installer-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('windows-installer-offline-{0}', github.ref) || format('windows-installer-push-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    # The offline bundle downloads and assembles several large model/runtime payloads.
    # Keep the job timeout above the 300-minute bundle step timeout.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ComfyUI offline bundle builder syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @(
            "scripts/prepare-comfyui-offline-bundle.ps1",
            "scripts/install-comfyui-offline.ps1",
            "scripts/create-comfyui-offline-installer.ps1",
            "scripts/audit-comfyui-portable-dependencies.ps1",
            "scripts/prepare-local-ai-offline-payload.ps1",
            "scripts/split-offline-bundle.ps1",
            "scripts/join-offline-bundle.ps1",
            "scripts/tests/test-offline-bundle-volumes.ps1",
            "scripts/install-local-ai-offline.ps1",
            "scripts/install-local-engines-transaction.ps1",
            "scripts/tests/test-local-ai-offline-install.ps1",
            "scripts/tests/test-local-engines-transaction.ps1",
            "scripts/tests/test-comfyui-portable-audit.ps1",
            "scripts/tests/test-windows-uninstall-data-preservation.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "PowerShell syntax validation failed: $script"
            }
            Write-Host "PowerShell syntax is valid: $script"
          }

      - name: Run local AI offline installer integration test
        shell: pwsh
        run: ./scripts/tests/test-local-ai-offline-install.ps1

      - name: Run offline bundle volume split and merge test
        shell: pwsh
        run: ./scripts/tests/test-offline-bundle-volumes.ps1

      - name: Run ComfyUI dependency audit integration test
        shell: pwsh
        run: ./scripts/tests/test-comfyui-portable-audit.ps1

      - name: Run local engine transaction integration test
        shell: pwsh
        run: ./scripts/tests/test-local-engines-transaction.ps1

      - name: Verify Windows uninstall preserves user data
        shell: pwsh
        run: ./scripts/tests/test-windows-uninstall-data-preservation.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Python environment
        shell: pwsh
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/api/.venv/Scripts/python.exe -m pip install -r apps/api/requirements.txt pyinstaller

      - name: Install frontend and desktop dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/web --include=dev
          npm ci --prefix apps/desktop --include=dev

      - name: Prepare FFmpeg tools (multiple download fallbacks)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $PWD "apps/desktop/build-resources/ffmpeg"
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          function Find-FfmpegPair {
            $ffmpeg = Get-Command ffmpeg.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            $ffprobe = Get-Command ffprobe.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ffmpeg -and $ffprobe) {
              return @{ Ffmpeg = $ffmpeg.Source; Ffprobe = $ffprobe.Source }
            }
            return $null
          }

          function Copy-FfmpegPair($pair) {
            if (!$pair -or !(Test-Path $pair.Ffmpeg) -or !(Test-Path $pair.Ffprobe)) {
              throw "FFmpeg and ffprobe executables were not both found."
            }
            Copy-Item $pair.Ffmpeg (Join-Path $target "ffmpeg.exe") -Force
            Copy-Item $pair.Ffprobe (Join-Path $target "ffprobe.exe") -Force
            foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
              $file = Get-Item (Join-Path $target $name)
              if ($file.Length -lt 1MB) { throw "$name is unexpectedly small." }
            }
            Write-Host "FFmpeg tools ready:"
            Get-ChildItem $target | Select-Object Name, Length
          }

          # Some hosted images already include FFmpeg.
          $pair = Find-FfmpegPair
          if ($pair) {
            Copy-FfmpegPair $pair
            exit 0
          }

          # First fallback: install the maintained Chocolatey package.
          try {
            Write-Host "FFmpeg not on PATH; trying Chocolatey..."
            choco install ffmpeg -y --no-progress
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin;C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin"
            $pair = Find-FfmpegPair
            if (!$pair) {
              $ffmpegFile = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter ffmpeg.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              $ffprobeFile = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter ffprobe.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($ffmpegFile -and $ffprobeFile) {
                $pair = @{ Ffmpeg = $ffmpegFile.FullName; Ffprobe = $ffprobeFile.FullName }
              }
            }
            if ($pair) {
              Copy-FfmpegPair $pair
              exit 0
            }
            Write-Warning "Chocolatey completed but executables were not located; trying GitHub release."
          } catch {
            Write-Warning "Chocolatey fallback failed: $($_.Exception.Message)"
          }

          # Second fallback: resolve the actual Windows ZIP asset from BtbN's
          # latest GitHub release instead of hard-coding a changing asset URL.
          $temp = Join-Path $env:RUNNER_TEMP "ffmpeg-github"
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          try {
            $release = Invoke-RestMethod -Headers @{ "User-Agent" = "AI-Comic-Studio-CI" } -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
            $asset = $release.assets |
              Where-Object { $_.name -match "win64-gpl.*\.zip$" -and $_.name -notmatch "shared" } |
              Select-Object -First 1
            if (!$asset) { throw "No win64 GPL ZIP asset found in the latest BtbN release." }
            $archive = Join-Path $temp "ffmpeg.zip"
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive -TimeoutSec 180
                if ((Get-Item $archive).Length -gt 1MB) { $downloaded = $true; break }
                throw "Downloaded archive is unexpectedly small."
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (!$downloaded) { throw "GitHub FFmpeg download did not complete." }
            $extract = Join-Path $temp "extract"
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $ffmpegFile = Get-ChildItem $extract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
            $ffprobeFile = Get-ChildItem $extract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
            if (!$ffmpegFile -or !$ffprobeFile) { throw "GitHub FFmpeg archive lacks ffmpeg.exe or ffprobe.exe." }
            Copy-FfmpegPair @{ Ffmpeg = $ffmpegFile.FullName; Ffprobe = $ffprobeFile.FullName }
            exit 0
          } catch {
            Write-Warning "GitHub release fallback failed: $($_.Exception.Message)"
          }

          # Final fallback: retry the original Gyan source rather than failing
          # on a transient 503 response immediately.
          $gyanArchive = Join-Path $temp "ffmpeg-gyan.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $gyanArchive -TimeoutSec 180
              if ((Get-Item $gyanArchive).Length -lt 1MB) { throw "Gyan archive is unexpectedly small." }
              $gyanExtract = Join-Path $temp "gyan-extract"
              Expand-Archive -LiteralPath $gyanArchive -DestinationPath $gyanExtract -Force
              $ffmpegFile = Get-ChildItem $gyanExtract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
              $ffprobeFile = Get-ChildItem $gyanExtract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
              if (!$ffmpegFile -or !$ffprobeFile) { throw "Gyan archive lacks required executables." }
              Copy-FfmpegPair @{ Ffmpeg = $ffmpegFile.FullName; Ffprobe = $ffprobeFile.FullName }
              exit 0
            } catch {
              if ($attempt -eq 3) { throw "All FFmpeg sources failed. Last error: $($_.Exception.Message)" }
              Write-Warning "Gyan attempt $attempt failed; retrying..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1

      - name: Verify installer and write SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "apps/desktop/release"
          $installers = @(Get-ChildItem $release -File -Filter "*Setup*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one fresh Windows installer; found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -LiteralPath (Join-Path $release "$($installer.Name).sha256") -Encoding ascii
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $hash"

      - name: Read desktop version
        id: desktop-version
        shell: pwsh
        run: |
          $package = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
          if (!$package.version -or $package.version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid desktop version in package.json." }
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $($package.version)"

      # Keep Setup.exe internal to the complete offline ZIP; never publish it alone.


      - name: Preflight disk space for complete offline bundle
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive = Get-PSDrive -Name $env:SystemDrive.TrimEnd(':')
          $freeGiB = [math]::Round($drive.Free / 1GB, 2)
          Write-Host "Available build disk space: $freeGiB GiB"
          if ($drive.Free -lt 24GB) {
            throw "完整离线套件预计约 13 GiB，包含 ComfyUI 四种运行包、本地 Qwen3 和 Stable Diffusion 图片模型；打包过程建议至少 24 GiB 可用空间；当前仅 $freeGiB GiB。为避免生成损坏包，已在下载大文件前停止。"
          }

      - name: Build and verify complete offline bundle
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        shell: pwsh
        timeout-minutes: 300
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "apps/desktop/release"
          $installers = @(Get-ChildItem $release -File -Filter "*Setup*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one freshly built Setup.exe; found $($installers.Count)." }
          $outputZip = Join-Path $release "AI漫剧制作大师-完整离线安装套件.zip"
          ./scripts/create-comfyui-offline-installer.ps1 -SkipBuild -SetupExe $installers[0].FullName -OutputZip $outputZip
          if (!(Test-Path -LiteralPath "$outputZip.parts.json") -or !(Test-Path -LiteralPath (Join-Path $release "AI漫剧制作大师-离线套件合并工具.ps1"))) {
            throw "完整离线套件分卷清单或合并工具缺失。"
          }
          $zip = Get-Item -LiteralPath $outputZip
          if ($zip.Length -lt 9GB) { throw "完整离线套件小于 9 GiB，拒绝作为完成品上传。" }
          Write-Host ("Verified offline bundle: {0:N2} GiB" -f ($zip.Length / 1GB))
          Get-Content -LiteralPath "$outputZip.sha256"

      - name: Prepare split bundle artifact groups
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Join-Path $PWD "apps/desktop/release"
          $base = "AI漫剧制作大师-完整离线安装套件.zip"
          $parts = @(Get-ChildItem -LiteralPath $release -File -Filter "$base.part*" | Where-Object { $_.Name -match ('^' + [regex]::Escape($base) + '\.part\d{3}$') } | Sort-Object Name)
          if ($parts.Count -lt 1) { throw "没有找到完整离线套件分卷。" }
          if (!(Test-Path -LiteralPath (Join-Path $release "$base.parts.json")) -or !(Test-Path -LiteralPath (Join-Path $release "$base.sha256"))) {
            throw "分卷清单或原始 ZIP SHA-256 文件缺失，不能删除原始 ZIP。"
          }
          # Preserve the original ZIP until every staged upload file has been
          # been copied and independently verified. A staging/copy failure must
          # never destroy the only complete archive in the runner workspace.
          $archive = Join-Path $release $base
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw "完整离线 ZIP 不存在。" }
          $archiveInfo = Get-Item -LiteralPath $archive
          $manifestPath = Join-Path $release "$base.parts.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.schema_version -ne 1 -or $manifest.archive_name -cne $base -or [long]$manifest.archive_size_bytes -ne [long]$archiveInfo.Length) {
            throw "分卷清单与原始 ZIP 元数据不匹配。"
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.archive_sha256 -cne $archiveHash) { throw "原始 ZIP SHA-256 与分卷清单不匹配。" }
          if ($parts.Count -ne @($manifest.parts).Count -or $parts.Count -lt 5 -or $parts.Count -gt 12) {
            throw "分卷数量与清单不一致，或超出 5 至 12 卷的上传分组范围。"
          }

          $stage = Join-Path $env:RUNNER_TEMP "offline-bundle-artifacts"
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          foreach ($group in 1..3) {
            $folder = Join-Path $stage "group$group"
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
          }
          [long]$stagedTotal = 0
          for ($i = 0; $i -lt $parts.Count; $i++) {
            $entry = $manifest.parts[$i]
            $expectedName = "$base.part$('{0:D3}' -f ($i + 1))"
            if ($entry.name -cne $expectedName -or $parts[$i].Name -cne $expectedName) {
              throw "分卷文件名或顺序与清单不一致：$expectedName"
            }
            $group = [math]::Floor($i / 4) + 1
            if ($group -gt 3) { throw "分卷超过预设的 12 卷上限，需要扩展分组后再上传。" }
            $destination = Join-Path (Join-Path $stage "group$group") $expectedName
            Copy-Item -LiteralPath $parts[$i].FullName -Destination $destination
            $staged = Get-Item -LiteralPath $destination
            if ([long]$staged.Length -ne [long]$entry.size_bytes) { throw "暂存分卷大小校验失败：$expectedName" }
            $stagedHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($stagedHash -cne ([string]$entry.sha256).ToLowerInvariant()) { throw "暂存分卷 SHA-256 校验失败：$expectedName" }
            $stagedTotal += [long]$staged.Length
          }
          if ($stagedTotal -ne [long]$archiveInfo.Length) { throw "暂存分卷总大小与原始 ZIP 不一致。" }

          $group3 = Join-Path $stage "group3"
          Copy-Item -LiteralPath $manifestPath -Destination $group3
          Copy-Item -LiteralPath (Join-Path $release "AI漫剧制作大师-离线套件合并工具.ps1") -Destination $group3
          Copy-Item -LiteralPath (Join-Path $release "$base.sha256") -Destination $group3
          foreach ($required in @("$base.parts.json", "AI漫剧制作大师-离线套件合并工具.ps1", "$base.sha256")) {
            $sourceFile = Join-Path $release $required
            $stagedFile = Join-Path $group3 $required
            if (!(Test-Path -LiteralPath $sourceFile -PathType Leaf) -or !(Test-Path -LiteralPath $stagedFile -PathType Leaf)) {
              throw "暂存上传元数据缺失：$required"
            }
            $sourceInfo = Get-Item -LiteralPath $sourceFile
            $stagedInfo = Get-Item -LiteralPath $stagedFile
            if ([long]$sourceInfo.Length -ne [long]$stagedInfo.Length) { throw "暂存上传元数据大小不一致：$required" }
            $sourceHash = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256).Hash.ToLowerInvariant()
            $stagedHash = (Get-FileHash -LiteralPath $stagedFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceHash -cne $stagedHash) { throw "暂存上传元数据 SHA-256 不一致：$required" }
          }
          $stagedChecksum = (Get-Content -LiteralPath (Join-Path $group3 "$base.sha256") -Raw).Trim()
          if ($stagedChecksum -notmatch ('^' + [regex]::Escape($archiveHash) + '\s+' + [regex]::Escape($base) + '$')) {
            throw "暂存的原始 ZIP SHA-256 文件内容不正确。"
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $stage "group1") -File).Count -ne [math]::Min(4, $parts.Count) -or
              @(Get-ChildItem -LiteralPath (Join-Path $stage "group2") -File).Count -ne [math]::Max(0, [math]::Min(4, $parts.Count - 4)) -or
              @(Get-ChildItem -LiteralPath $group3 -File).Count -ne ([math]::Max(0, $parts.Count - 8) + 3)) {
            throw "三个上传分组的文件数量校验失败。"
          }

          # Delete the bulky original only after every part and assembly file is
          # present in staging and all copied volume hashes have been verified.
          Remove-Item -LiteralPath $archive -Force
          "group1=$stage/group1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "group2=$stage/group2" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "group3=$stage/group3" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Prepared and verified $($parts.Count) parts plus assembly metadata in three upload groups."

      - name: Upload offline bundle volumes 1-4
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Comic-Studio-Offline-Bundle-Volumes-1
          path: ${{ runner.temp }}/offline-bundle-artifacts/group1/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline bundle volumes 5-8
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Comic-Studio-Offline-Bundle-Volumes-2
          path: ${{ runner.temp }}/offline-bundle-artifacts/group2/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline bundle remaining volumes and assembly manifest
        if: (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/product-completion-foundation')
        uses: actions/upload-artifact@v4
        with:
          name: AI-Comic-Studio-Offline-Bundle-Volumes-3
          path: ${{ runner.temp }}/offline-bundle-artifacts/group3/*
          if-no-files-found: error
          retention-days: 14

      - name: Hold public release until the complete offline bundle is distributable
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          Write-Host "Public release is intentionally paused."
          Write-Host "The standalone Setup.exe requires the adjacent ComfyUI-Payload folder."
          Write-Host "Do not publish Setup.exe alone; publish only after the complete offline ZIP has a verified, size-compatible distribution host and all third-party license checks are complete."
  # Run the expensive real upstream archive inventory only when explicitly
  # requested by a one-time PR-body marker; no ComfyUI payload is modified.
  audit-comfyui-portable-dependencies:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, '<!-- run-comfyui-portable-license-audit -->')
    uses: ./.github/workflows/comfyui-portable-license-audit.yml
    with:
      release_tag: ''
