name: Prepare desktop installer (AI resources already local)

"on":
  push:
    branches: [master, offline-ai-engine-integration]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/build-windows.ps1'
      - 'docs/manual/**'
      - '.github/workflows/build-full-offline-installer.yml'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  desktop-installer:
    name: Verify and publish desktop installer only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Find the successful desktop installer for this exact commit
        id: setup-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $branch = "${{ github.ref_name }}"
          $sha = "${{ github.sha }}"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-release.yml/runs?branch=$([uri]::EscapeDataString($branch))&per_page=100"
          $selected = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $matching = @($response.workflow_runs | Where-Object { $_.head_sha -eq $sha })
            $successful = $matching | Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "success" } | Select-Object -First 1
            $failed = $matching | Where-Object { $_.status -eq "completed" -and $_.conclusion -in @("failure", "timed_out", "action_required", "startup_failure") } | Select-Object -First 1
            $cancelled = $matching | Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "cancelled" } | Select-Object -First 1
            if ($cancelled) { Write-Host "A matching installer run was cancelled; waiting for a successful run for this exact commit." }
            if ($successful) { $selected = $successful; break }
            if ($failed) { throw "Windows desktop installer workflow failed for commit $sha (run $($failed.id), conclusion $($failed.conclusion))." }
            Write-Host "Waiting for Windows desktop installer CI for $sha ($attempt/60)..."
            Start-Sleep -Seconds 30
          }
          if (!$selected) { throw "No successful Windows installer workflow was found for exact commit $sha within 30 minutes." }
          "run_id=$($selected.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using verified Windows installer run $($selected.id) for $sha"

      - name: Download Windows setup artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Comic-Studio-Windows-Setup
          run-id: ${{ steps.setup-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/setup-artifact

      - name: Verify desktop installer and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setupRoot = Join-Path $env:RUNNER_TEMP "setup-artifact"
          $setupFiles = @(Get-ChildItem $setupRoot -Recurse -File -Filter "*Setup*.exe")
          if ($setupFiles.Count -ne 1) { throw "Expected exactly one Windows Setup executable; found $($setupFiles.Count)." }
          $setup = $setupFiles[0]
          $hashFile = Get-Item ($setup.FullName + ".sha256") -ErrorAction SilentlyContinue
          if (!$hashFile) { throw "Windows Setup SHA-256 file is missing." }
          $expected = ((Get-Content $hashFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Windows Setup SHA-256 verification failed." }
          $output = Join-Path $PWD "desktop-installer"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $finalInstaller = Join-Path $output "AI漫剧制作大师-Setup.exe"
          Copy-Item $setup.FullName $finalInstaller
          $finalHash = (Get-FileHash $finalInstaller -Algorithm SHA256).Hash
          "$finalHash  AI漫剧制作大师-Setup.exe" | Set-Content (Join-Path $output "AI漫剧制作大师-Setup.exe.sha256") -Encoding ascii
          Write-Host ("Verified desktop installer: {0:N2} MiB" -f ($setup.Length / 1MB))
          Write-Host "Final download name SHA256: $finalHash"
          Write-Host "AI resources are intentionally not downloaded or repackaged; the user already has them locally."

      - name: Upload desktop installer only
        uses: actions/upload-artifact@v4
        with:
          name: AI-Comic-Studio-Desktop-Installer
          path: |
            desktop-installer/AI漫剧制作大师-Setup.exe
            desktop-installer/AI漫剧制作大师-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
