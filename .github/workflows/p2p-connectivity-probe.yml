name: P2P connectivity probe
on:
  push:
    branches:
      - test/p2p-connectivity-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install torrent tools
        run: |
          sudo apt-get update
          sudo apt-get install -y transmission-cli
      - name: Create small disposable test payload and torrent
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR="$RUNNER_TEMP/p2p-seed"
          rm -rf "$SEED_DIR"
          mkdir -p "$SEED_DIR"
          chmod 755 "$SEED_DIR"
          dd if=/dev/urandom of="$SEED_DIR/p2p-probe-8MiB.bin" bs=1M count=8 status=none
          cd "$SEED_DIR"
          transmission-create \
            -t udp://tracker.opentrackr.org:1337/announce \
            -t udp://open.stealth.si:80/announce \
            -t udp://tracker.torrent.eu.org:451/announce \
            -o "$RUNNER_TEMP/p2p-probe.torrent" \
            p2p-probe-8MiB.bin
          install -m 0644 "$RUNNER_TEMP/p2p-probe.torrent" "$SEED_DIR/p2p-probe.torrent"
          chmod 644 "$SEED_DIR/p2p-probe-8MiB.bin" "$SEED_DIR/p2p-probe.torrent"
          transmission-show -m "$SEED_DIR/p2p-probe.torrent" > "$RUNNER_TEMP/magnet.txt"
          echo "MAGNET_URI_BEGIN"
          cat "$RUNNER_TEMP/magnet.txt"
          echo "MAGNET_URI_END"
          sha256sum "$SEED_DIR/p2p-probe-8MiB.bin"
          ls -ld "$SEED_DIR"
          ls -l "$SEED_DIR"
      - name: Publish disposable torrent metadata
        uses: actions/upload-artifact@v4
        with:
          name: p2p-probe-metadata
          path: |
            ${{ runner.temp }}/p2p-probe.torrent
            ${{ runner.temp }}/magnet.txt
          retention-days: 2
      - name: Seed for a limited connectivity window
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR="$RUNNER_TEMP/p2p-seed"
          chmod 755 "$SEED_DIR"
          chmod 644 "$SEED_DIR/p2p-probe-8MiB.bin" "$SEED_DIR/p2p-probe.torrent"
          cd "$SEED_DIR"
          echo "Starting Transmission seeder with readable payload and metadata."
          timeout 12m transmission-cli \
            --download-dir "$SEED_DIR" \
            --port 51413 \
            "$SEED_DIR/p2p-probe.torrent" || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 124 ]]; then
            exit "$status"
          fi
