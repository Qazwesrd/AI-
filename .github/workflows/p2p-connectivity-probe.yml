name: P2P connectivity probe
on:
  push:
    branches:
      - test/p2p-connectivity-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install torrent tools
        run: |
          sudo apt-get update
          sudo apt-get install -y transmission-cli transmission-daemon
          sudo systemctl stop transmission-daemon || true
      - name: Create test payload as runner
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR="$HOME/p2p-seed"
          mkdir -p "$SEED_DIR"
          dd if=/dev/urandom of="$SEED_DIR/p2p-probe-8MiB.bin" bs=1M count=8 status=none
          transmission-create \
            -t udp://tracker.opentrackr.org:1337/announce \
            -t udp://open.stealth.si:80/announce \
            -t udp://tracker.torrent.eu.org:451/announce \
            -o "$SEED_DIR/p2p-probe.torrent" \
            "$SEED_DIR/p2p-probe-8MiB.bin"
          transmission-show -m "$SEED_DIR/p2p-probe.torrent" > "$RUNNER_TEMP/magnet.txt"
          cp "$SEED_DIR/p2p-probe.torrent" "$RUNNER_TEMP/p2p-probe.torrent"
          sha256sum "$SEED_DIR/p2p-probe-8MiB.bin"
          echo "MAGNET_URI_BEGIN"
          cat "$RUNNER_TEMP/magnet.txt"
          echo "MAGNET_URI_END"
          test -r "$SEED_DIR/p2p-probe-8MiB.bin"
          test -r "$SEED_DIR/p2p-probe.torrent"
      - name: Publish disposable torrent metadata
        uses: actions/upload-artifact@v4
        with:
          name: p2p-probe-metadata
          path: |
            ${{ runner.temp }}/p2p-probe.torrent
            ${{ runner.temp }}/magnet.txt
          retention-days: 2
      - name: Seed for a limited connectivity window
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR="$HOME/p2p-seed"
          echo "Starting standalone Transmission seeder as runner."
          timeout 12m transmission-cli \
            --config-dir "$RUNNER_TEMP/transmission-config" \
            --download-dir "$SEED_DIR" \
            --port 51414 \
            "$SEED_DIR/p2p-probe.torrent" || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 124 ]]; then
            exit "$status"
          fi
