name: P2P connectivity probe
on:
  push:
    branches:
      - test/p2p-connectivity-probe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install torrent tools and service account
        run: |
          sudo apt-get update
          sudo apt-get install -y transmission-cli transmission-daemon
          id debian-transmission
      - name: Create test payload as Transmission service user
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR=/var/lib/transmission-daemon/downloads/p2p-probe
          sudo systemctl stop transmission-daemon || true
          sudo install -d -o debian-transmission -g debian-transmission -m 0755 "$SEED_DIR"
          sudo -u debian-transmission dd if=/dev/urandom of="$SEED_DIR/p2p-probe-8MiB.bin" bs=1M count=8 status=none
          sudo -u debian-transmission transmission-create \
            -t udp://tracker.opentrackr.org:1337/announce \
            -t udp://open.stealth.si:80/announce \
            -t udp://tracker.torrent.eu.org:451/announce \
            -o "$SEED_DIR/p2p-probe.torrent" \
            "$SEED_DIR/p2p-probe-8MiB.bin"
          sudo -u debian-transmission transmission-show -m "$SEED_DIR/p2p-probe.torrent" > "$RUNNER_TEMP/magnet.txt"
          sudo cp "$SEED_DIR/p2p-probe.torrent" "$RUNNER_TEMP/p2p-probe.torrent"
          sudo chown runner:runner "$RUNNER_TEMP/magnet.txt" "$RUNNER_TEMP/p2p-probe.torrent"
          sha256sum "$SEED_DIR/p2p-probe-8MiB.bin"
          echo "MAGNET_URI_BEGIN"
          cat "$RUNNER_TEMP/magnet.txt"
          echo "MAGNET_URI_END"
          sudo -u debian-transmission test -r "$SEED_DIR/p2p-probe-8MiB.bin"
          sudo -u debian-transmission test -r "$SEED_DIR/p2p-probe.torrent"
      - name: Publish disposable torrent metadata
        uses: actions/upload-artifact@v4
        with:
          name: p2p-probe-metadata
          path: |
            ${{ runner.temp }}/p2p-probe.torrent
            ${{ runner.temp }}/magnet.txt
          retention-days: 2
      - name: Seed for a limited connectivity window
        shell: bash
        run: |
          set -euo pipefail
          SEED_DIR=/var/lib/transmission-daemon/downloads/p2p-probe
          sudo systemctl stop transmission-daemon || true
          sudo -u debian-transmission test -r "$SEED_DIR/p2p-probe.torrent"
          sudo -u debian-transmission test -r "$SEED_DIR/p2p-probe-8MiB.bin"
          echo "Starting standalone Transmission seeder as debian-transmission."
          sudo -u debian-transmission timeout 12m transmission-cli \
            --download-dir "$SEED_DIR" \
            --port 51414 \
            "$SEED_DIR/p2p-probe.torrent" || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 124 ]]; then
            exit "$status"
          fi
